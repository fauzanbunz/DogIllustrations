<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remeko - Cyberpunk AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --neon-pink: #ff003c;
            --neon-cyan: #00f0ff;
            --matrix-green: #00ff41;
            --bg-dark: #0a0a0c;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            color: var(--neon-cyan);
        }

        /* Matrix Background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 1.0; /* Ditingkatkan agar sangat cerah dan jelas */
        }

        /* CRT Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            z-index: 50;
            pointer-events: none;
        }

        /* Vignette Effect */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            z-index: 49;
            pointer-events: none;
        }

        /* TV Roll / Wave Effect */
        .tv-roll {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 15vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(240,255,255,0.03) 50%, rgba(255,255,255,0) 100%);
            backdrop-filter: blur(1px) hue-rotate(5deg);
            animation: roll 7s linear infinite;
            z-index: 48;
            pointer-events: none;
        }

        @keyframes roll {
            0% { transform: translateY(-20vh); }
            100% { transform: translateY(120vh); }
        }

        /* HUD Overlay (Top Left) */
        .hud-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 20;
            font-size: 0.85rem;
            text-shadow: 0 0 5px var(--bg-dark);
            background: rgba(10, 10, 12, 0.4);
            padding: 1rem;
            border-left: 2px solid var(--neon-cyan);
            backdrop-filter: blur(4px);
        }

        .hud-overlay p {
            margin: 0.3rem 0;
        }

        /* Live Subtitle Area */
        .subtitle-container {
            position: fixed;
            bottom: 15vh;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 900px;
            text-align: center;
            z-index: 20;
            pointer-events: none;
        }

        .live-text {
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 0 5px var(--neon-cyan), 0 0 15px var(--neon-cyan), 2px 2px 0px rgba(255,0,60,0.5);
            line-height: 1.4;
            min-height: 2.8rem;
            display: inline-block;
        }

        .speaker-label {
            color: var(--neon-pink);
            font-size: 1rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--neon-pink);
        }

        /* Floating Input Area */
        .floating-input-area {
            position: fixed;
            bottom: 4vh;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            max-width: 700px;
            display: flex;
            background: rgba(10, 10, 12, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 30px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(8px);
            z-index: 20;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .floating-input-area:focus-within {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }

        .cyber-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--neon-cyan);
            padding: 1rem 1.5rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            outline: none;
        }

        .cyber-btn {
            background: rgba(0, 240, 255, 0.1);
            color: var(--neon-cyan);
            border: none;
            border-left: 1px solid rgba(0, 240, 255, 0.4);
            padding: 0 1.5rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cyber-btn:hover {
            background: var(--neon-cyan);
            color: #000;
        }
        
        #mic-btn {
            border-left: none;
            border-right: 1px solid rgba(0, 240, 255, 0.4);
            padding: 0 1rem;
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        /* Character Full Screen Overlay */
        .fullscreen-character-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; /* Berada di atas matrix, di bawah UI */
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: float-up-down 6s ease-in-out infinite;
        }

        @keyframes float-up-down {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        .fullscreen-character {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mix-blend-mode: lighten;
            filter: contrast(1.2) saturate(1.5) drop-shadow(0 0 20px rgba(255,0,60,0.3));
            opacity: 0.85;
            transition: filter 0.2s ease; /* Transisi halus untuk efek komputasi */
        }

        .typing-cursor {
            display: inline-block;
            width: 10px;
            height: 1.2rem;
            background-color: var(--neon-cyan);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Top Right Title */
        .top-right-title {
            position: fixed;
            top: 20px;
            right: 30px;
            z-index: 20;
            font-size: 2.5rem;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink), 2px 2px 0px rgba(0, 240, 255, 0.5);
            font-weight: bold;
            letter-spacing: 4px;
            pointer-events: none;
            opacity: 0.8;
            animation: text-flicker 4s infinite alternate;
        }

        @keyframes text-flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 0.8; }
            20%, 24%, 55% { opacity: 0.2; }
        }

        /* Extra Old Monitor Waves / Interference */
        .interference {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 2px,
                transparent 2px,
                transparent 4px
            );
            z-index: 47;
            pointer-events: none;
            opacity: 0.4;
        }

        .tv-roll-fast {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 8vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%);
            z-index: 48;
            pointer-events: none;
            animation: roll-fast 3s linear infinite;
        }

        @keyframes roll-fast {
            0% { transform: translateY(-10vh); }
            100% { transform: translateY(110vh); }
        }

        /* Radar Element (Left) */
        .radar-container {
            position: fixed;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 2px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.2);
            z-index: 15;
            pointer-events: none;
            overflow: hidden;
            background: rgba(0, 240, 255, 0.05);
        }

        .radar-grid {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(0, 240, 255, 0.3);
            background:
                linear-gradient(rgba(0, 240, 255, 0.3) 1px, transparent 1px) 50% 50% / 100% 50% no-repeat,
                linear-gradient(90deg, rgba(0, 240, 255, 0.3) 1px, transparent 1px) 50% 50% / 50% 100% no-repeat;
        }

        .radar-sweep {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(0, 240, 255, 0) 70%, rgba(0, 240, 255, 0.5) 100%);
            animation: radar-spin 4s linear infinite;
        }

        @keyframes radar-spin {
            100% { transform: rotate(360deg); }
        }

        .radar-blip {
            position: absolute;
            width: 4px; height: 4px;
            background: var(--neon-pink);
            border-radius: 50%;
            top: 35%; left: 65%;
            box-shadow: 0 0 5px var(--neon-pink);
            animation: blip-fade 4s infinite;
        }

        @keyframes blip-fade {
            0%, 80%, 100% { opacity: 0; transform: scale(1); }
            90% { opacity: 1; transform: scale(1.5); }
        }

        /* Running Code (Right) */
        .running-code-container {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 250px;
            height: calc(100% - 200px);
            z-index: 15;
            pointer-events: none;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            opacity: 0.6;
        }

        .running-code-text {
            font-size: 0.75rem;
            color: var(--neon-cyan);
            text-align: right;
            line-height: 1.4;
            font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 3px var(--neon-cyan);
        }
    </style>
</head>
<body>

    <!-- Canvas for Matrix Background -->
    <canvas id="matrix-canvas"></canvas>
    
    <!-- Screen overlays -->
    <div class="scanlines"></div>
    <div class="interference"></div>
    <div class="vignette"></div>
    <div class="tv-roll"></div>
    <div class="tv-roll-fast"></div>

    <!-- Top Right Title -->
    <div class="top-right-title">REMEKO</div>

    <!-- Transparent Radar (Left) -->
    <div class="radar-container">
        <div class="radar-grid"></div>
        <div class="radar-sweep"></div>
        <div class="radar-blip"></div>
    </div>

    <!-- Running Code (Right) -->
    <div class="running-code-container">
        <div id="running-code-text" class="running-code-text"></div>
    </div>

    <!-- Fullscreen Character -->
    <div class="fullscreen-character-container">
        <img src="https://raw.githubusercontent.com/fauzanbunz/DogIllustrations/main/remeko_idle%201.jpg" alt="Remeko Character" class="fullscreen-character" id="main-character">
    </div>

    <!-- Floating HUD Elements -->
    <div class="hud-overlay">
        <p class="text-white font-bold mb-2">SYS.AI // REMEKO_V2.5 <span id="status-indicator" class="text-xs text-white bg-green-500 px-1 ml-2 rounded-sm">ONLINE</span></p>
        <p><span class="text-[#00ff41]">CPU:</span> <span id="cpu-load">42</span>%</p>
        <p><span class="text-[#ff003c]">MEM:</span> 8942 / 9000 TB</p>
        <p><span class="text-[#00f0ff]">UPLINK:</span> ENCRYPTED</p>
    </div>

    <!-- Live Subtitle Area (Replaces Chat Box) -->
    <div class="subtitle-container">
        <div class="speaker-label" id="speaker-name">REMEKO</div>
        <div class="live-text" id="live-subtitle">...<span class="typing-cursor"></span></div>
    </div>

    <!-- Floating Input Area -->
    <div class="floating-input-area">
        <button id="mic-btn" class="cyber-btn" title="Voice Command">🎤</button>
        <input type="text" id="user-input" class="cyber-input" placeholder="Initiate voice or text command..." autocomplete="off">
        <button id="send-btn" class="cyber-btn">SEND</button>
    </div>

    <script>
        // --- MATRIX BACKGROUND LOGIC ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789';
        const alphabet = katakana + latin + nums;

        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];

        for(let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 10, 12, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff33cc'; // Pink Matrix yang lebih cerah dan neon
            ctx.font = fontSize + 'px monospace';

            for(let i = 0; i < drops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- SIMULATE CPU LOAD ---
        setInterval(() => {
            document.getElementById('cpu-load').innerText = Math.floor(Math.random() * 40) + 20;
        }, 1500);

        // --- CHARACTER ANIMATION LOGIC ---
        const charImgElement = document.getElementById('main-character');
        const imgIdle1 = 'https://raw.githubusercontent.com/fauzanbunz/DogIllustrations/main/remeko_idle%201.jpg';
        const imgIdle2 = 'https://raw.githubusercontent.com/fauzanbunz/DogIllustrations/main/remeko_idle%202.jpg';
        const imgBlink = 'https://raw.githubusercontent.com/fauzanbunz/DogIllustrations/main/remeko_merem.jpg';
        const imgSpeak = 'https://raw.githubusercontent.com/fauzanbunz/DogIllustrations/main/remeko_ngomong.jpg';
        
        let currentIdleState = imgIdle1;
        let isBlinkingState = false;
        let isSpeakingState = false;
        let talkTimer;

        // Fungsi Berkedip
        function randomBlink() {
            if (!isBlinkingState && !isSpeakingState) {
                isBlinkingState = true;
                charImgElement.src = imgBlink;
                setTimeout(() => {
                    charImgElement.src = currentIdleState;
                    isBlinkingState = false;
                }, 150); // Durasi mata terpejam (150ms)
            }
            
            // Kedipan berikutnya (acak antara 2s - 6s)
            const nextBlink = Math.random() * 4000 + 2000;
            setTimeout(randomBlink, nextBlink);
        }

        // Fungsi Ganti Pose Idle
        function randomIdleSwitch() {
            if (!isBlinkingState && !isSpeakingState) {
                currentIdleState = (currentIdleState === imgIdle1) ? imgIdle2 : imgIdle1;
                charImgElement.src = currentIdleState;
            }
            
            // Ganti posisi tubuh berikutnya (acak antara 3s - 8s)
            const nextSwitch = Math.random() * 5000 + 3000;
            setTimeout(randomIdleSwitch, nextSwitch);
        }

        // Fungsi Animasi Berbicara (Lip-sync)
        function startSpeakingAnim() {
            isSpeakingState = true;
            function talk() {
                if (!isSpeakingState) {
                    charImgElement.src = currentIdleState;
                    return;
                }
                // Acak buka tutup mulut
                if (!isBlinkingState) {
                    charImgElement.src = (Math.random() > 0.4) ? imgSpeak : currentIdleState;
                }
                talkTimer = setTimeout(talk, Math.random() * 120 + 50); // Kecepatan gerakan mulut
            }
            talk();
        }

        function stopSpeakingAnim() {
            isSpeakingState = false;
            clearTimeout(talkTimer);
            charImgElement.src = currentIdleState;
        }

        // Mulai animasi background idle
        setTimeout(randomBlink, 2000);
        setTimeout(randomIdleSwitch, 3000);

        // --- AI CHAT LOGIC (Gemini API Integration) ---
        const apiKey = ""; // API Key provided by execution environment
        const subtitleBox = document.getElementById('live-subtitle');
        const speakerName = document.getElementById('speaker-name');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const statusIndicator = document.getElementById('status-indicator');
        
        let conversationHistory = [];

        const systemPrompt = `You are "Remeko", an advanced AI assistant in the form of a cyber-dog operating in a dystopian cyberpunk world. 
You are connected to a secret neural network. 
Your tone is slightly cold, analytical, and logical, but you have the voice of a young female. You occasionally use technical or hacking terms. 
Use English. Answer VERY briefly (1-3 sentences) as if speaking directly as movie subtitles. Avoid using bold markdown or long lists.`;

        // Load specific voices to find a natural female English voice
        let femaleVoice = null;
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            
            // Prioritaskan suara wanita yang natural (tergantung browser & OS)
            const preferredVoices = [
                'Microsoft Aria Online (Natural) - English (United States)',
                'Google UK English Female',
                'Google US English',
                'Samantha',
                'Victoria',
                'Karen',
                'Microsoft Zira Desktop'
            ];

            for (let name of preferredVoices) {
                femaleVoice = voices.find(v => v.name.includes(name));
                if (femaleVoice) break;
            }

            // Fallback jika suara natural di atas tidak ditemukan
            if (!femaleVoice) {
                femaleVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Female') || v.name.includes('Woman')));
            }
            if (!femaleVoice) {
                femaleVoice = voices.find(v => v.lang.startsWith('en'));
            }
        }

        if ('speechSynthesis' in window) {
            loadVoices(); // Try immediate load
            window.speechSynthesis.onvoiceschanged = loadVoices; // Wait for async loading in some browsers
        }

        // TTS Function for Young Female Voice
        function speakText(text) {
            if (!('speechSynthesis' in window)) return false;
            window.speechSynthesis.cancel(); 
            const cleanText = text.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            if (femaleVoice) utterance.voice = femaleVoice;
            
            // Pitch 1.05 memberikan kesan natural tanpa membuatnya terdengar sintetik/robot
            utterance.pitch = 1.05; 
            utterance.rate = 1.0;  // Kecepatan normal
            
            // Sinkronisasi animasi mulut dengan durasi suara (audio)
            utterance.onstart = () => startSpeakingAnim();
            utterance.onend = () => stopSpeakingAnim();
            utterance.onerror = () => stopSpeakingAnim();

            window.speechSynthesis.speak(utterance);
            return true;
        }

        // Typewriter effect for live speaking + Animasi Mulut
        async function typeWriter(text) {
            subtitleBox.innerHTML = '';
            const cleanText = text.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*/g, '').replace(/\n/g, ' ');
            let i = 0;
            
            const isSpeaking = speakText(text); // Start speaking
            
            // Fallback jika browser tidak mendukung suara, jalankan animasi manual
            if (!isSpeaking) {
                startSpeakingAnim(); 
            }

            return new Promise(resolve => {
                function type() {
                    if (i < cleanText.length) {
                        subtitleBox.innerHTML += cleanText.charAt(i);
                        i++;
                        // Sedikit mempercepat ketikan agar lebih pas dengan kecepatan bicara
                        let speed = Math.floor(Math.random() * 20) + 30; 
                        setTimeout(type, speed);
                    } else {
                        subtitleBox.innerHTML += '<span class="typing-cursor"></span>';
                        // Fallback stop jika tidak ada TTS
                        if (!isSpeaking) {
                            stopSpeakingAnim(); 
                        }
                        resolve();
                    }
                }
                type();
            });
        }

        async function fetchAIResponse(message) {
            conversationHistory.push({ role: "user", parts: [{ text: message }] });

            const payload = {
                contents: conversationHistory,
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "[ERROR]: Bad data packet received.";
                
                conversationHistory.push({ role: "model", parts: [{ text: aiText }] });
                return aiText;
            } catch (error) {
                console.error("AI Fetch Error:", error);
                return "[SYSTEM_DISTORTION]: Signal disrupted. Please retransmit.";
            }
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            // UI States saat mengirim
            userInput.value = '';
            sendBtn.disabled = true;
            statusIndicator.innerText = "SYNCING";
            statusIndicator.className = "text-xs text-black bg-yellow-500 px-1 ml-2 rounded-sm";
            
            speakerName.innerText = "USER_PROXY";
            subtitleBox.innerHTML = text + '<span class="typing-cursor"></span>';

            // Filter distorsi komputasi warna (tanpa zigzag)
            charImgElement.style.filter = "contrast(2) saturate(0) invert(0.2)";
            
            setTimeout(() => {
                charImgElement.style.filter = "contrast(1.2) saturate(1.5) drop-shadow(0 0 20px rgba(255,0,60,0.3))";
            }, 300);

            // Fetch AI Response
            const aiResponseText = await fetchAIResponse(text);

            // Restore UI & Tampilkan AI berbicara
            speakerName.innerText = "REMEKO";
            await typeWriter(aiResponseText);
            
            sendBtn.disabled = false;
            statusIndicator.innerText = "ONLINE";
            statusIndicator.className = "text-xs text-white bg-green-500 px-1 ml-2 rounded-sm";
            userInput.focus();
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // --- VOICE RECOGNITION (WEB SPEECH API) ---
        const micBtn = document.getElementById('mic-btn');
        let recognition;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US'; // English Recognition
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                micBtn.style.color = 'var(--neon-pink)';
                micBtn.innerText = '🔴';
                userInput.placeholder = "Listening to voice signal...";
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                userInput.value = speechResult;
                handleSend(); // Auto send after voice captured
            };

            recognition.onerror = function(event) {
                console.error("Speech recognition error", event.error);
                resetMicUI();
            };

            recognition.onend = function() {
                resetMicUI();
            };
        } else {
            micBtn.style.display = 'none'; // Hide if not supported
            userInput.placeholder = "Browser does not support Voice Command.";
        }

        function resetMicUI() {
            micBtn.style.color = 'var(--neon-cyan)';
            micBtn.innerText = '🎤';
            userInput.placeholder = "Initiate voice or text command...";
        }

        micBtn.addEventListener('click', () => {
            if (recognition) {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            } else {
                userInput.placeholder = "Voice Module offline/not supported.";
            }
        });

        // Initialize greeting
        window.onload = async () => {
            speakerName.innerText = "SYSTEM";
            subtitleBox.innerHTML = 'Establishing secure connection...<span class="typing-cursor"></span>';
            
            setTimeout(async () => {
                speakerName.innerText = "REMEKO";
                await typeWriter("Initialization protocol complete. Signal stable. What can I hack for you today?");
            }, 1500);
        };

        // --- RUNNING CODE LOGIC (RIGHT SIDE) ---
        const runningCodeBox = document.getElementById('running-code-text');
        
        function generateCodeLine() {
            const hex = Math.random().toString(16).substr(2, 6).toUpperCase();
            const prefixes = ['SYS.MEM.', 'NET.OVR.', 'DAT.REQ.', 'AI.THD.', 'ENC.KEY.', 'SEC.PRT.'];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            const status = Math.random() > 0.1 ? 'OK' : 'ERR';
            const color = status === 'ERR' ? 'style="color: var(--neon-pink); text-shadow: 0 0 3px var(--neon-pink);"' : '';
            return `<span ${color}>[${hex}] ${prefix} ${status} // ${Math.floor(Math.random() * 9999)}</span>`;
        }

        function addRunningCode() {
            const line = document.createElement('div');
            line.innerHTML = generateCodeLine();
            runningCodeBox.appendChild(line);
            
            // Batasi jumlah maksimal baris agar tidak memperberat performa peramban (browser)
            if (runningCodeBox.childElementCount > 35) {
                runningCodeBox.removeChild(runningCodeBox.firstChild);
            }
        }
        
        // Memperbarui baris kode dengan kecepatan tinggi
        setInterval(addRunningCode, 150);

    </script>
</body>
</html>
